<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1013">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Фонотека">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Фонотека</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<style>
/* Layout: одна колонка до 640px, закреплённые мини-плеер и навигация внизу, полноэкранный плеер и листы поверх */
:root{
  --bg:#EDEFF3; --surface:#FFFFFF; --surface2:#E2E6EC; --ink:#14171C; --ink2:#4A515D; --ink3:#767E8B; --line:#D3D8E0;
  --accent:#F0A81C; --accent-ink:#8A5300; --on-accent:#1B1200; --danger:#C0392B;
  --bar:#F3CC7A;
  --font-display:'Unbounded','Manrope',system-ui,sans-serif;
  --font-body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1013; --surface:#171A1F; --surface2:#21252C; --ink:#ECEEF2; --ink2:#A8AFBB; --ink3:#7A818E; --line:#2B3038;
  --accent:#F5B53D; --accent-ink:#F5B53D; --on-accent:#1B1200; --danger:#FF7B6B; --bar:#6B5222; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1013; --surface:#171A1F; --surface2:#21252C; --ink:#ECEEF2; --ink2:#A8AFBB; --ink3:#7A818E; --line:#2B3038;
  --accent:#F5B53D; --accent-ink:#F5B53D; --on-accent:#1B1200; --danger:#FF7B6B; --bar:#6B5222; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.4;
  padding-block:8px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px;border-radius:6px}
svg.i{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.app{max-width:640px;margin:0 auto;padding-bottom:170px}
.top{display:flex;align-items:center;gap:10px;min-height:56px}
.top h1{font-family:var(--font-display);font-weight:600;font-size:21px;letter-spacing:-.01em;margin:0;flex:1;min-width:0;text-wrap:balance}
.top .sub{font-size:13px;color:var(--ink3);font-weight:500}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);flex:none}
.ib:hover{background:var(--surface2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:22px;font-weight:700;font-size:14px;background:var(--surface);border:1px solid var(--line)}
.btn.pri{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.btn.sm{height:36px;padding:0 14px;font-size:13px}
.btn:active{transform:scale(.98)}
.row2{display:flex;gap:10px;flex-wrap:wrap}
h2{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:26px 0 10px}
.muted{color:var(--ink3)}

/* обложки */
.cv{position:relative;width:44px;height:44px;border-radius:8px;background-size:cover;background-position:center;flex:none;display:grid;place-items:center;overflow:hidden}
.cv i{font-style:normal;font-family:var(--font-display);font-weight:600;color:rgba(255,255,255,.85);font-size:1.1em}
.cv.l{width:100%;height:auto;aspect-ratio:1;max-width:340px;border-radius:16px;font-size:64px}
.cv.m{width:40px;height:40px}

/* список треков */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:8px 4px;border-radius:12px;cursor:pointer;min-width:0}
.row:hover{background:var(--surface)}
.row .rt{flex:1;min-width:0;display:flex;flex-direction:column}
.row .rt b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt span{font-size:13px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .dur{font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums}
.row.playing .rt b{color:var(--accent-ink)}
.row.playing .cv::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.35)}
.row.playing .cv::before{content:"";position:absolute;z-index:1;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--accent)}

/* Моя волна */
.wave{background:var(--accent);color:var(--on-accent);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:16px}
.wave .wh{display:flex;align-items:center;gap:14px}
.wave h3{font-family:var(--font-display);font-weight:600;font-size:24px;margin:0;letter-spacing:-.02em}
.wave p{margin:4px 0 0;font-size:13px;font-weight:500;opacity:.8}
.wave .go{width:60px;height:60px;border-radius:50%;background:var(--on-accent);color:var(--accent);display:grid;place-items:center;flex:none;margin-left:auto}
.wave .go svg{width:28px;height:28px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:34px;padding:0 14px;border-radius:17px;font-size:13px;font-weight:700;border:1px solid var(--line);color:var(--ink2);background:transparent}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wave .chip{border-color:rgba(27,18,0,.35);color:var(--on-accent)}
.wave .chip.on{background:var(--on-accent);color:var(--accent);border-color:var(--on-accent)}
.eq{display:flex;align-items:flex-end;gap:3px;height:22px}
.eq s{display:block;width:4px;background:var(--on-accent);border-radius:2px;height:30%}
.eq.live s{animation:eq 900ms ease-in-out infinite alternate}
.eq s:nth-child(2){animation-delay:-.3s}.eq s:nth-child(3){animation-delay:-.6s}.eq s:nth-child(4){animation-delay:-.15s}.eq s:nth-child(5){animation-delay:-.45s}
@keyframes eq{from{height:20%}to{height:100%}}
@media (prefers-reduced-motion:reduce){.eq.live s{animation:none;height:60%}}

.strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.tile{width:112px;flex:none;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .cv{width:112px;height:112px;border-radius:12px;font-size:36px}
.tile b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile span{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-4px}

.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:0 14px;height:44px;color:var(--ink3)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;height:100%;color:var(--ink)}
.empty{text-align:center;padding:36px 8px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty h3{font-family:var(--font-display);font-weight:600;font-size:20px;margin:0;text-wrap:balance}
.empty p{margin:0;color:var(--ink2);max-width:36ch}
.empty .note{width:64px;height:64px;border-radius:20px;background:var(--surface2);display:grid;place-items:center;color:var(--accent-ink)}
.empty .note svg{width:30px;height:30px}

/* плейлисты */
.pl{display:flex;align-items:center;gap:14px;padding:10px 4px;border-radius:12px;cursor:pointer}
.pl:hover{background:var(--surface)}
.pl .cv{width:56px;height:56px;border-radius:10px}
.pl .rt{flex:1;min-width:0}
.pl .rt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .rt span{font-size:13px;color:var(--ink3)}
.likedcv{background:linear-gradient(145deg,var(--accent),#E4571E);color:var(--on-accent)}
.likedcv svg{fill:currentColor;stroke:none;width:26px;height:26px}

/* статистика */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.hero{font-family:var(--font-display);font-weight:600;font-size:34px;letter-spacing:-.02em;line-height:1.1}
.kpis{display:flex;gap:20px;margin-top:10px;flex-wrap:wrap}
.kpis div{display:flex;flex-direction:column}
.kpis b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.kpis span{font-size:12px;color:var(--ink3);font-weight:600}
.chart{position:relative;height:150px;display:flex;align-items:flex-end;gap:3px;margin-top:6px;border-bottom:1px solid var(--line)}
.chart::before,.chart::after{content:"";position:absolute;left:0;right:0;border-top:1px dashed var(--line);pointer-events:none}
.chart::before{top:0}.chart::after{top:50%}
.bc{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;cursor:pointer;position:relative;z-index:1}
.bc i{display:block;width:100%;background:var(--bar);border-radius:4px 4px 0 0;min-height:2px}
.bc.on i{background:var(--accent)}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin-top:6px;font-weight:600}
.readout{font-size:14px;font-weight:600;min-height:22px;margin-top:10px}
.readout span{color:var(--ink3);font-weight:500}
.rank{display:flex;flex-direction:column;gap:12px}
.rk{display:grid;grid-template-columns:22px 40px 1fr auto;gap:10px;align-items:center;min-width:0}
.rk .n{font-size:13px;color:var(--ink3);font-weight:700;font-variant-numeric:tabular-nums;text-align:center}
.rk .rt{min-width:0}
.rk .rt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.rk .rt s{display:block;height:4px;border-radius:2px;background:var(--bar);margin-top:5px;text-decoration:none}
.rk .v{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;text-align:right}
.rk.ar{grid-template-columns:22px 1fr auto}
.part{display:grid;grid-template-columns:64px 1fr 64px;gap:10px;align-items:center;font-size:13px;margin-bottom:8px}
.part s{display:block;height:10px;border-radius:5px;background:var(--bar);text-decoration:none}
.part .v{text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}

/* нижняя панель */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px);pointer-events:none}
.dock-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-bottom:8px;pointer-events:auto}
.mini{position:relative;display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 8px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.14)}
.mini .mt{flex:1;min-width:0;display:flex;flex-direction:column;cursor:pointer}
.mini .mt b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .mt span{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .pp{background:var(--accent);color:var(--on-accent)}
.mini .pg{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);width:0}
.mini .cv{cursor:pointer}
.nav{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:4px;box-shadow:0 6px 20px rgba(0,0,0,.1)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:16px;font-size:11px;font-weight:700;color:var(--ink3)}
.nav button.on{background:var(--surface2);color:var(--accent-ink)}

/* полный плеер */
#full{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-top:max(8px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.fp{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.fp .fh{display:flex;align-items:center;gap:8px}
.fp .fh div{flex:1;text-align:center;font-size:12px;font-weight:700;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fp .art{display:grid;place-items:center}
.fp .ti{display:flex;align-items:center;gap:10px}
.fp .ti div{flex:1;min-width:0}
.fp .ti b{display:block;font-family:var(--font-display);font-weight:600;font-size:20px;letter-spacing:-.01em;text-wrap:balance}
.fp .ti span{color:var(--ink2);font-size:14px}
.heart.on{color:var(--accent-ink)}
.heart.on svg{fill:currentColor}
.seek{display:flex;flex-direction:column;gap:2px}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--p),var(--line) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);margin-top:-6px;border:2px solid var(--bg)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.ctl{display:flex;align-items:center;justify-content:space-between}
.ctl .ib{width:48px;height:48px}
.ctl .ib.on{color:var(--accent-ink);background:var(--surface2)}
.ctl .big{width:68px;height:68px;background:var(--accent);color:var(--on-accent)}
.ctl .big svg{width:30px;height:30px}
.ctl .rep{position:relative}
.ctl .rep em{position:absolute;right:8px;top:8px;font-style:normal;font-size:10px;font-weight:800}

/* листы */
#sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sh-bd{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.sh{position:relative;width:100%;max-width:640px;max-height:82%;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 16px;padding-bottom:max(18px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
.sh h3{font-family:var(--font-display);font-weight:600;font-size:17px;margin:0 0 6px}
.sh .hd{display:flex;align-items:center;gap:12px;margin-bottom:8px;min-width:0}
.sh .hd div{min-width:0}
.sh .hd b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh .hd span{font-size:13px;color:var(--ink3)}
.mi{display:flex;align-items:center;gap:14px;height:48px;padding:0 6px;border-radius:12px;font-weight:600;width:100%;text-align:left}
.mi:hover{background:var(--surface2)}
.mi.danger{color:var(--danger)}
.mi .ck{margin-left:auto;color:var(--accent-ink);opacity:0}
.mi.on .ck{opacity:1}
.field{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 14px;width:100%;outline:0}
.field:focus{border-color:var(--accent-ink)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:13px;font-weight:600;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.vh{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
label.btn{cursor:pointer;user-select:none;-webkit-user-select:none}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.demo{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.demo b{font-weight:700}
.demo span{font-size:13px;color:var(--ink2)}
.dropping::after{content:"Отпустите, чтобы добавить";position:fixed;inset:12px;border:2px dashed var(--accent-ink);border-radius:20px;display:grid;place-items:center;font-weight:700;background:color-mix(in srgb,var(--bg) 85%,transparent);z-index:90;pointer-events:none}

/* ===== дополнения v2 ===== */
.vh{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
label.btn,label.mi{cursor:pointer;user-select:none;-webkit-user-select:none}
.btn.danger,.armed{color:var(--danger)!important;border-color:var(--danger)!important}
.nav button{font-size:10.5px;padding:7px 0 6px;min-width:0}
.row,.tile,.pl{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.chip{display:inline-flex;align-items:center;gap:6px}
.chip svg{width:16px;height:16px}
.btn svg{width:18px;height:18px}

/* карточки и баннеры */
.demo{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.demo b{font-weight:700}
.demo span{font-size:13px;color:var(--ink2)}
.card h4{margin:0 0 10px;font-family:var(--font-display);font-weight:600;font-size:15px}
.card+.card{margin-top:12px}
.line{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600}
.line em{font-style:normal;font-size:13px}
.sl{display:grid;grid-template-columns:64px 1fr 56px;gap:8px;align-items:center;font-size:13px;color:var(--ink2)}
.sl em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink3)}
.fl{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--ink3);margin-top:10px;letter-spacing:.02em}
.fl .field{font-weight:500;font-size:15px;color:var(--ink)}
.field.ta{height:auto;padding:10px 14px;resize:vertical;line-height:1.4;font-family:inherit}
.edcv{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.edcv .cv.m{width:64px;height:64px}
.lyr{white-space:pre-wrap;line-height:1.55;font-size:15px;max-height:60vh;overflow:auto}
.menu{display:flex;flex-direction:column}
.menu .mi{margin:0 -6px}

/* сегменты */
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:3px;margin-bottom:12px}
.seg button{flex:1;height:34px;border-radius:11px;font-size:13px;font-weight:700;color:var(--ink3)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* выбор нескольких */
.cb{display:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--ink3);flex:none;place-items:center;color:transparent;transition:background-color .15s,border-color .15s}
.cb svg{width:14px;height:14px;stroke-width:3}
body.selmode .row .cb{display:grid}
body.selmode .row .mb{display:none}
.row.sel .cb,.cb.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.row.sel{background:var(--surface)}
body.selmode #mini{display:none}
.selb{gap:6px}
.selb b{flex:1;font-size:14px;padding-left:6px;white-space:nowrap}
.selb .dng{color:var(--danger)}

/* цель и серия */
.goal{display:flex;align-items:center;gap:14px;cursor:pointer;padding:12px 16px}
.goal .ring{width:52px;height:52px;flex:none}
.rg0{fill:none;stroke:var(--line);stroke-width:6}
.rg1{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.goal .gt{flex:1;min-width:0;display:flex;flex-direction:column}
.goal .gt b{font-weight:700}
.goal .gt span{font-size:12.5px;color:var(--ink3)}
.goal .gi{color:var(--ink3)}
.goal.done .gi{color:var(--accent-ink)}
.wrbtn{width:100%;margin:12px 0 14px;justify-content:flex-start}

/* стат: умная подборка и итоги */
.smartcv{color:rgba(255,255,255,.9)}
.smartcv svg{width:24px;height:24px;fill:currentColor;stroke:none}
.wr{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.wr .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.wr .big{font-family:var(--font-display);font-weight:600;font-size:56px;letter-spacing:-.03em;line-height:1}
.wr .mid{font-family:var(--font-display);font-weight:600;font-size:20px;letter-spacing:-.01em;text-wrap:balance}
.wr.hero1{background:var(--accent);color:var(--on-accent);border:0}
.wr.hero1 span{font-weight:600;font-size:14px;opacity:.85}
.wtrack{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.wtrack .cv.l{max-width:220px}
.wtrack b{font-family:var(--font-display);font-weight:600;font-size:20px}
.wtrack span{color:var(--ink2);font-size:14px}
.wl{display:flex;flex-direction:column;gap:10px}
.wl div{display:flex;align-items:center;gap:10px;min-width:0}
.wl i{font-style:normal;width:22px;text-align:center;font-weight:700;color:var(--ink3);font-variant-numeric:tabular-nums}
.wl b{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl span{color:var(--ink2);font-size:13px}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wgrid .wr{margin:0}

/* онлайн, список, дубли */
.search .btn{flex:none}
.note-err{color:var(--danger);font-size:14px}
.orow .odl{flex:none;min-width:96px}
.orow .odl.ok{color:var(--accent-ink)}
.how{margin:8px 0 0;padding-left:18px;color:var(--ink2);font-size:14px;display:flex;flex-direction:column;gap:6px}
.wst{width:34px;height:34px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;color:var(--ink3);flex:none}
.wst.ok{background:var(--accent);color:var(--on-accent)}
.wst svg{width:18px;height:18px}
.wrow{cursor:default}
.dg{padding:8px}
.dr{display:flex;align-items:center;gap:10px;padding:6px;border-radius:12px;cursor:pointer;min-width:0}
.dr .rt{flex:1;min-width:0;display:flex;flex-direction:column}
.dr .rt b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr .rt span{font-size:12px;color:var(--ink3)}

/* настройки */
.swatches{display:flex;flex-wrap:wrap;gap:12px}
.swt{width:38px;height:38px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#1B1200;position:relative}
.swt span{opacity:0;transform:scale(.5);transition:all .18s}
.swt.on span{opacity:1;transform:scale(1)}
.swt svg{width:20px;height:20px;stroke-width:3}
.swt.on{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--c)}
.ctl .big.pop,.go.pop{animation:pop .4s}

/* визуализатор */
.art{width:100%;max-width:340px;margin:0 auto;cursor:pointer}
.viz{position:absolute;inset:0;width:100%;height:100%;border-radius:16px;background:rgba(0,0,0,.45)}
.sh .lbl,.btn .lbl,.mi .lbl{display:inline}

/* ===== анимации ===== */
.rp{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.2;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
.btn,.ib,.chip,.nav button,.pl,.tile,.mi,.row,.swt,.seg button,.goal,.dr{transition:transform .14s ease,background-color .18s,color .18s,border-color .18s,box-shadow .18s}
.btn:active,.chip:active,.mi:active,.seg button:active{transform:scale(.95)}
.ib:active{transform:scale(.86)}
.nav button:active{transform:scale(.9)}
.row:active,.pl:active,.tile:active,.goal:active,.dr:active{transform:scale(.98)}
.swt:active{transform:scale(.88)}
.ctl .big:active,.wave .go:active{transform:scale(.9)}
.heart svg{transition:transform .2s}
.heart.pop svg{animation:heartpop .5s}
@keyframes heartpop{0%{transform:scale(1)}30%{transform:scale(1.5)}60%{transform:scale(.88)}100%{transform:scale(1)}}
@keyframes up{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes view{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.sh{animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sh-bd{animation:fade .2s}
#full:not([hidden]){animation:up .32s cubic-bezier(.2,.8,.2,1)}
#main.enter{animation:view .28s ease}
.bc i{transform-origin:bottom;animation:grow .55s cubic-bezier(.2,.8,.2,1) backwards}
.mini{animation:up .3s cubic-bezier(.2,.8,.2,1)}
.wr{animation:view .4s ease backwards}
.wr:nth-child(2){animation-delay:.06s}.wr:nth-child(3){animation-delay:.12s}.wr:nth-child(4){animation-delay:.18s}.wr:nth-child(5){animation-delay:.24s}
#toast{transform:translateX(-50%) translateY(8px);transition:opacity .2s,transform .2s}
#toast.show{transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* колонки не должны сжимать элементы (иначе кнопка уезжает из-под пальца) */
.sh>*,.fp>*,.wave>*,.demo>*,.list>*,.card>*,#main>*,.empty>*,.edcv>*{flex-shrink:0}
.stick{position:sticky;bottom:0;background:var(--surface);margin:8px -16px 0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sh:has(.stick){padding-bottom:0}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top"></header>
  <main id="main"><p class="muted">Загружаю библиотеку…</p></main>
</div>
<div class="dock"><div class="dock-in">
  <div id="selbar"></div>
  <div id="mini"></div>
  <nav class="nav" id="nav" aria-label="Разделы">
    <button data-act="tab" data-v="home" id="n-home"></button>
    <button data-act="tab" data-v="lib" id="n-lib"></button>
    <button data-act="tab" data-v="pls" id="n-pls"></button>
    <button data-act="tab" data-v="stats" id="n-stats"></button>
    <button data-act="tab" data-v="more" id="n-more"></button>
  </nav>
</div></div>
<div id="full" hidden></div>
<div id="sheet" hidden></div>
<div id="toast" role="status"></div>
<input id="file-in" class="vh" type="file" accept="audio/*,.mp3,.m4a,.flac,.wav,.ogg,.opus,.aac" multiple>
<input id="backup-in" class="vh" type="file" accept=".fonoteka,application/octet-stream">
<input id="wish-in" class="vh" type="file" accept=".csv,.txt,text/csv,text/plain">
<input id="cover-in" class="vh" type="file" accept="image/*">
<script>
(function(){
'use strict';
/* ===== p1: утилиты, иконки, хранилище, состояние, настройки, тема ===== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const hash=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};

/* ---------- иконки ---------- */
const P={
 play:'<path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/>',
 pause:'<path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor" stroke="none"/>',
 next:'<path d="M6 5l9 7-9 7z" fill="currentColor" stroke="none"/><path d="M18 5v14"/>',
 prev:'<path d="M18 5l-9 7 9 7z" fill="currentColor" stroke="none"/><path d="M6 5v14"/>',
 shuffle:'<path d="M3 7h3c4 0 5 10 9 10h3M3 17h3c1.6 0 2.7-1.4 3.7-3M15 7h3M16 5l2 2-2 2M16 15l2 2-2 2"/>',
 repeat:'<path d="M4 11V9a3 3 0 013-3h11M15 3l3 3-3 3M20 13v2a3 3 0 01-3 3H6M9 21l-3-3 3-3"/>',
 heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 more:'<circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/>',
 home:'<path d="M4 11l8-7 8 7v8a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1z"/>',
 lib:'<path d="M5 4v16M10 4v16M15 5.5l4 14.5"/>',
 pls:'<path d="M4 7h11M4 12h11M4 17h6"/><circle cx="17" cy="17" r="2.5"/><path d="M19.5 17V8"/>',
 chart:'<path d="M5 20V11M12 20V4M19 20v-6"/>',
 dice:'<rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="9" cy="9" r="1.2" fill="currentColor"/><circle cx="15" cy="15" r="1.2" fill="currentColor"/><circle cx="15" cy="9" r="1.2" fill="currentColor"/><circle cx="9" cy="15" r="1.2" fill="currentColor"/>',
 wave:'<path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/>',
 down:'<path d="M6 9l6 6 6-6"/>',
 back:'<path d="M15 5l-7 7 7 7"/>',
 trash:'<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>',
 search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',
 note:'<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 queue:'<path d="M4 7h12M4 12h12M4 17h7M17 15l4 2.5-4 2.5z"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
 moon:'<path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/>',
 lyrics:'<path d="M5 6h14M5 11h14M5 16h9"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/>',
 download:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
 upload:'<path d="M12 16V5M7 9l5-5 5 5M5 20h14"/>',
 eq:'<path d="M4 8h9M17 8h3M4 16h3M11 16h9"/><circle cx="15" cy="8" r="2"/><circle cx="9" cy="16" r="2"/>',
 select:'<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/>',
 cloud:'<path d="M7 18a4 4 0 010-8 5 5 0 019.6-1A4.5 4.5 0 0117 18z"/>',
 flame:'<path d="M12 3s5 4 5 9a5 5 0 01-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3 1-5 1-8z"/>',
 star:'<path d="M12 4l2.5 5.2 5.7.8-4.1 4 1 5.7L12 17l-5.1 2.7 1-5.7-4.1-4 5.7-.8z"/>',
 disc:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/>',
 user:'<circle cx="12" cy="8" r="3.5"/><path d="M5 20c1-4 4-5.5 7-5.5s6 1.5 7 5.5"/>',
 trophy:'<path d="M8 4h8v5a4 4 0 01-8 0zM8 6H5a3 3 0 003 4M16 6h3a3 3 0 01-3 4M12 13v4M8 20h8"/>',
 copy:'<rect x="8" y="8" width="11" height="12" rx="2"/><path d="M5 16V6a2 2 0 012-2h8"/>',
 list:'<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',
 link:'<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/>'
};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[n]||''}</svg>`;

/* ---------- хранилище: IndexedDB, запасной вариант в памяти ---------- */
const mem={tracks:new Map(),files:new Map(),playlists:new Map(),plays:[]};
let useMem=false, dbp=null;
function openDB(){return new Promise((res,rej)=>{
  let r; try{r=indexedDB.open('fonoteka',1);}catch(e){return rej(e);}
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('tracks',{keyPath:'id'});d.createObjectStore('files');d.createObjectStore('playlists',{keyPath:'id'});d.createObjectStore('plays',{autoIncrement:true});};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));});}
const getdb=()=>dbp||(dbp=openDB());
async function run(store,mode,fn){const d=await getdb();return new Promise((res,rej)=>{const t=d.transaction(store,mode);const rq=fn(t.objectStore(store));t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});}
async function sAll(st){if(useMem)return st==='plays'?mem.plays.slice():[...mem[st].values()];return run(st,'readonly',s=>s.getAll());}
async function sGet(st,k){if(useMem)return mem[st].get(k);return run(st,'readonly',s=>s.get(k));}
async function sPut(st,v,k){if(useMem){if(st==='plays')mem.plays.push(v);else mem[st].set(k!==undefined?k:v.id,v);return;}return run(st,'readwrite',s=>k!==undefined?s.put(v,k):s.put(v));}
async function sDel(st,k){if(useMem){mem[st].delete(k);return;}return run(st,'readwrite',s=>s.delete(k));}
async function sReplacePlays(list){if(useMem){mem.plays=list.slice();return;}return run('plays','readwrite',s=>{s.clear();list.forEach(x=>s.add(x));});}
const save=(st,v,k)=>sPut(st,v,k).catch(()=>toast('Не удалось сохранить изменения'));

/* ---------- настройки ---------- */
const DEF={theme:'auto',accent:'amber',goal:30,eq:{on:false,pre:0,g:[0,0,0,0,0]},xf:0,ws:{mood:'any',disc:50,gap:true},jamendo:''};
function loadSet(){
  const j=lsGet('fono.set',{})||{};
  const s=Object.assign({},DEF,j,{eq:Object.assign({},DEF.eq,j.eq||{}),ws:Object.assign({},DEF.ws,j.ws||{})});
  if(!Array.isArray(s.eq.g)||s.eq.g.length!==5)s.eq.g=[0,0,0,0,0];
  return s;}

/* ---------- состояние ---------- */
const S={tracks:new Map(),playlists:[],plays:[],tab:'home',view:null,q:'',sort:'new',libTab:'tracks',
  queue:[],base:[],qi:-1,label:'',wave:false,waveMode:'mix',shuffle:false,repeat:'off',
  range:'7',cur:null,tok:0,menu:null,statsSel:null,sel:null,set:loadSet(),sleep:null,viz:false,xfPending:false,
  online:{src:'archive',q:'',res:null,busy:false,err:'',dl:{}},edit:null,lp:false};
const T=id=>S.tracks.get(id);
const arr=()=>[...S.tracks.values()];
const curId=()=>S.queue[S.qi];
const saveSet=()=>lsSet('fono.set',S.set);

/* ---------- форматы ---------- */
const fmt=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const fmtMin=s=>{const m=Math.round(s/60);if(s>0&&m<1)return '<1 мин';if(m>=60)return Math.floor(m/60)+' ч '+(m%60)+' мин';return m+' мин';};
const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const k=n%10;return n>10&&n<20?c:k>1&&k<5?b:k===1?a:c;};
const nTracks=n=>n+' '+plural(n,'трек','трека','треков');
const fmtMB=b=>b>=1073741824?(b/1073741824).toFixed(1)+' ГБ':(b/1048576).toFixed(b>=104857600?0:1)+' МБ';
const norm=s=>String(s||'').toLowerCase().replace(/ё/g,'е').replace(/\(.*?\)|\[.*?\]/g,' ').replace(/\b(feat|ft|prod)\b.*$/,' ').replace(/[^a-zа-я0-9]+/g,' ').trim();

/* ---------- обложки ---------- */
const covUrls=new Map();
function coverUrl(t){if(!t.cover)return null;let u=covUrls.get(t.id);if(!u){u=URL.createObjectURL(t.cover);covUrls.set(t.id,u);}return u;}
function dropCoverUrl(id){const u=covUrls.get(id);if(u){URL.revokeObjectURL(u);covUrls.delete(id);}}
function cover(t,cls){
  const u=t&&coverUrl(t);
  if(u)return `<div class="cv ${cls||''}" style="background-image:url(${u})"></div>`;
  const h=hash((t&&(t.artist+t.title))||'x')%360;
  const ch=((t&&t.title)||'?').trim().charAt(0).toUpperCase();
  return `<div class="cv ${cls||''}" style="background:linear-gradient(145deg,hsl(${h} 42% 40%),hsl(${(h+50)%360} 48% 24%))"><i>${esc(ch)}</i></div>`;
}
async function shrinkImage(blob,sz){
  try{
    const bmp=await createImageBitmap(blob);const sc=Math.min(1,sz/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.max(1,Math.round(bmp.width*sc));c.height=Math.max(1,Math.round(bmp.height*sc));
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b),'image/jpeg',.82));
  }catch(e){return null;}}

/* ---------- слои и кнопка «назад» ---------- */
const L={stack:[],silent:0};
function pushLayer(k){L.stack.push(k);try{history.pushState({f:L.stack.length},'');}catch(e){}}
function popLayer(k){const i=L.stack.lastIndexOf(k);if(i<0)return;L.stack.splice(i,1);L.silent++;try{history.back();}catch(e){L.silent--;}}
window.addEventListener('popstate',()=>{
  if(L.silent>0){L.silent--;return;}
  const k=L.stack.pop();if(!k)return;
  if(k==='sheet')closeSheet(true);
  else if(k==='full'){$('#full').hidden=true;stopViz();}
  else if(k==='view'){S.view=null;exitSel();render();}
});
function setView(v){
  const had=!!S.view;S.view=v;exitSel();
  if(v&&!had)pushLayer('view');else if(!v&&had)popLayer('view');
  saveState(true);}

/* ---------- тосты и листы ---------- */
let toastT;
function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2800);}
function sheet(html){
  const el=$('#sheet');const was=!el.hidden;
  el.innerHTML='<div class="sh-bd" data-act="sheet-close"></div><div class="sh" role="dialog">'+html+'</div>';
  el.hidden=false;if(!was)pushLayer('sheet');}
function closeSheet(fromPop){
  const el=$('#sheet');if(el.hidden)return;
  el.hidden=true;el.innerHTML='';S.menu=null;S.edit=null;
  if(!fromPop)popLayer('sheet');}

/* ---------- тема и акцентный цвет ---------- */
const ACC={amber:['#F0A81C','#F5B53D'],coral:['#FF7A59','#FF8A6B'],lime:['#8CCB2B','#A6E04A'],teal:['#1FB5A6','#35D0C0'],sky:['#3E92F2','#5AA9FF'],violet:['#8B7BFF','#A394FF'],pink:['#F25C9A','#FF78AE'],red:['#EF4B52','#FF6B70']};
const ACC_NAMES={amber:'Янтарь',coral:'Коралл',lime:'Лайм',teal:'Бирюза',sky:'Небо',violet:'Фиалка',pink:'Роза',red:'Алый'};
let themeSet=false;
function themeIsDark(){const a=document.documentElement.getAttribute('data-theme');if(a==='dark')return true;if(a==='light')return false;try{return matchMedia('(prefers-color-scheme: dark)').matches;}catch(e){return false;}}
function applyTheme(){
  const r=document.documentElement,th=S.set.theme;
  if(th==='light'||th==='dark'){r.setAttribute('data-theme',th);themeSet=true;}
  else if(themeSet){r.removeAttribute('data-theme');themeSet=false;}
  const dark=themeIsDark(),c=ACC[S.set.accent]||ACC.amber,a=dark?c[1]:c[0],st=r.style;
  st.setProperty('--accent',a);st.setProperty('--on-accent','#1B1200');
  st.setProperty('--accent-ink',dark?a:`color-mix(in srgb, ${a} 45%, #000)`);
  st.setProperty('--bar',dark?`color-mix(in srgb, ${a} 38%, #0E1013)`:`color-mix(in srgb, ${a} 45%, #fff)`);
  const m=$('meta[name=theme-color]');if(m)m.content=dark?'#0E1013':'#EDEFF3';
}
try{const mq=matchMedia('(prefers-color-scheme: dark)');(mq.addEventListener?mq.addEventListener.bind(mq,'change'):mq.addListener.bind(mq))(applyTheme);}catch(e){}

/* ===== p2: добавление файлов, статистика, волна, резервная копия, список желаний, онлайн-поиск ===== */
const AUDIO_RE=/\.(mp3|m4a|aac|flac|wav|ogg|oga|opus|wma|aiff?|weba)$/i;
function readTags(file){return new Promise(res=>{
  if(!window.jsmediatags)return res({});
  let done=false;const fin=v=>{if(!done){done=true;res(v);}};
  try{window.jsmediatags.read(file,{onSuccess:t=>fin(t.tags||{}),onError:()=>fin({})});}catch(e){fin({});}
  setTimeout(()=>fin({}),6000);});}
function tagLyrics(tags){
  const l=tags.lyrics||tags.USLT||tags.unsynchronisedlyrics;if(!l)return '';
  const s=typeof l==='string'?l:(l.lyrics||(l.data&&l.data.lyrics)||'');
  return String(s||'').slice(0,30000);}
async function makeCover(pic){
  try{return await shrinkImage(new Blob([new Uint8Array(pic.data)],{type:pic.format||'image/jpeg'}),320);}catch(e){return null;}}
function getDuration(file){return new Promise(res=>{
  const a=new Audio(),u=URL.createObjectURL(file);let done=false;
  const fin=d=>{if(done)return;done=true;URL.revokeObjectURL(u);res(isFinite(d)?d:0);};
  a.preload='metadata';a.onloadedmetadata=()=>fin(a.duration);a.onerror=()=>fin(0);setTimeout(()=>fin(0),6000);a.src=u;});}
function fromName(name){

/* демо-треки: синтез прямо на устройстве */
function synthWav(steps,stepLen,total,gain){
  const sr=22050,n=Math.floor(sr*total),d=new Int16Array(n);
  for(let s=0;s*stepLen<total;s++){
    const f=steps[s%steps.length];if(!f)continue;
    const st=Math.floor(s*stepLen*sr),len=Math.floor(stepLen*sr*1.6);
    for(let i=0;i<len&&st+i<n;i++){
      const t=i/sr,env=Math.exp(-t*5)*Math.min(1,i/80);
      const v=(Math.sin(2*Math.PI*f*t)+.35*Math.sin(4*Math.PI*f*t)+.15*Math.sin(6*Math.PI*f*t))*env*gain;
      d[st+i]=Math.max(-32767,Math.min(32767,d[st+i]+v*9000));
    }
  }
  const b=new ArrayBuffer(44+n*2),v=new DataView(b),w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++)v.setInt16(44+i*2,d[i],true);
  return new Blob([b],{type:'audio/wav'});}

/* ---------- статистика ---------- */
function agg(from){
  const m=new Map();
  for(const p of S.plays){
    if((from&&p.ts<from)||!S.tracks.has(p.tid))continue;
    let a=m.get(p.tid);if(!a){a={plays:0,sec:0,last:0,skips:0,hours:new Array(24).fill(0)};m.set(p.tid,a);}
    a.sec+=p.sec;if(p.counted){a.plays++;a.hours[new Date(p.ts).getHours()]++;}
    if(p.skip)a.skips++;if(p.ts>a.last)a.last=p.ts;
  }
  return m;}
const dayKey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();};
function dayMinutes(){const m=new Map();for(const p of S.plays){if(!S.tracks.has(p.tid))continue;const k=dayKey(p.ts);m.set(k,(m.get(k)||0)+p.sec);}return m;}
function streaks(){
  const m=dayMinutes(),ok=k=>(m.get(k)||0)>=60;
  let cur=0;const d=new Date();d.setHours(12,0,0,0);
  if(!ok(dayKey(+d)))d.setDate(d.getDate()-1);
  while(ok(dayKey(+d))){cur++;d.setDate(d.getDate()-1);}
  const days=[...m.keys()].filter(ok).map(k=>{const [y,mo,da]=k.split('-').map(Number);return Date.UTC(y,mo-1,da)/864e5;}).sort((a,b)=>a-b);
  let best=0,run=0,prev=null;
  for(const x of days){run=prev!==null&&x===prev+1?run+1:1;if(run>best)best=run;prev=x;}
  return {cur,best,today:(m.get(dayKey(Date.now()))||0)};}
function buckets(range){
  const now=new Date(),out=[];
  const Lc=(d,o)=>d.toLocaleDateString('ru-RU',o);
  if(range==='all'){
    for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);
      out.push({from:+d,to:+new Date(d.getFullYear(),d.getMonth()+1,1),label:Lc(d,{month:'long',year:'numeric'}),short:Lc(d,{month:'short'}),sec:0});}
  }else{
    for(let i=+range-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);
      out.push({from:+d,to:+new Date(d.getFullYear(),d.getMonth(),d.getDate()+1),label:Lc(d,{weekday:'long',day:'numeric',month:'long'}),short:Lc(d,{day:'numeric',month:'short'}),sec:0});}}
  for(const p of S.plays){if(!S.tracks.has(p.tid))continue;const b=out.find(b=>p.ts>=b.from&&p.ts<b.to);if(b)b.sec+=p.sec;}
  return out;}
function wrappedData(year){
  const from=+new Date(year,0,1),to=+new Date(year+1,0,1);
  const ps=S.plays.filter(p=>p.ts>=from&&p.ts<to&&S.tracks.has(p.tid));
  if(!ps.length)return null;
  const tr=new Map(),ar=new Map(),mo=new Array(12).fill(0),dayS=new Map(),parts=[0,0,0,0];

    const d=new Date(p.ts);mo[d.getMonth()]+=p.sec;

/* ---------- Моя волна ---------- */
function waveScore(t,a,seedArtist,mode,now){
  const h=now.getHours(),ws=S.set.ws;let s=0;
  if(t.liked)s+=2.5;
  if(a){
    s+=Math.log1p(a.plays)*0.8;s-=Math.min(a.skips,4)*0.9;
    const tot=a.hours.reduce((x,y)=>x+y,0);
    if(tot){let near=0;for(let d=-2;d<=2;d++)near+=a.hours[(h+d+24)%24];s+=2*near/tot;}
    const ago=(now-a.last)/36e5;if(ago<3)s-=3;else if(ago<24)s-=1;
  }else s+=mode==='new'?3:(ws.disc/100)*2.2;
  if(seedArtist&&t.artist&&t.artist===seedArtist)s+=1.2;
  if(mode==='fav'&&!t.liked&&!(a&&a.plays>=2))s-=4;
  if(mode==='new'&&a&&a.plays>0)s-=3;
  if(ws.mood!=='any'&&t.mood===ws.mood)s+=2.5;
  return s+Math.random()*1.5;}
function buildWave(n,exclude,seedId){
  const now=new Date(),A=agg(),seed=T(seedId),sa=seed&&seed.artist,ws=S.set.ws;
  let pool=arr().filter(t=>t.id!==seedId&&!exclude.has(t.id)&&!t.nowave);
  if(ws.mood!=='any'){const m=pool.filter(t=>t.mood===ws.mood);if(m.length>=3)pool=m;}
  if(!pool.length)pool=arr().filter(t=>!t.nowave);
  if(!pool.length)pool=arr();
  let items=pool.map(t=>({id:t.id,ar:t.artist,w:Math.exp(waveScore(t,A.get(t.id),sa,S.waveMode,now)/1.2)}));
  const out=[];let lastArtist=sa||'';
  while(out.length<n&&items.length){
    if(ws.gap&&lastArtist)items.forEach(i=>{if(i.ar===lastArtist)i.w*=0.15;});
    const tot=items.reduce((x,i)=>x+i.w,0);let r=Math.random()*tot,k=0;
    for(;k<items.length-1;k++){r-=items[k].w;if(r<=0)break;}
    out.push(items[k].id);lastArtist=items[k].ar;items.splice(k,1);}
  return out;}
function startWave(){
  if(!S.tracks.size){toast('Сначала добавьте музыку');return;}
  startQueue(buildWave(15,new Set(),null),0,'Моя волна',true);}
function extendWave(){

function smartTracks(k){
  const now=Date.now(),day=864e5,all=agg(),m30=agg(now-30*day);
  let ts=arr();
  if(k==='forgot')ts=ts.filter(t=>{const a=all.get(t.id);return a&&a.plays>0&&now-a.last>30*day;}).sort((a,b)=>all.get(a.id).last-all.get(b.id).last);
  else if(k==='top30')ts=ts.filter(t=>m30.has(t.id)&&m30.get(t.id).plays>0).sort((a,b)=>m30.get(b.id).plays-m30.get(a.id).plays).slice(0,25);
  else if(k==='new7')ts=ts.filter(t=>now-t.added<7*day).sort((a,b)=>b.added-a.added);
  else if(k==='faded')ts=ts.filter(t=>{const a=all.get(t.id);return t.liked&&(!a||now-a.last>14*day);});
  else if(k==='unheard')ts=ts.filter(t=>!all.has(t.id)||all.get(t.id).plays===0).sort((a,b)=>b.added-a.added);
  return ts;}

/* ---------- дубли ---------- */
async function quickHash(id){
  try{
    const f=await sGet('files',id);if(!f||!(window.crypto&&crypto.subtle))return '';
    const head=new Uint8Array(await f.slice(0,262144).arrayBuffer()),tail=new Uint8Array(await f.slice(Math.max(0,f.size-65536)).arrayBuffer());
    const buf=new Uint8Array(head.length+tail.length);buf.set(head,0);buf.set(tail,head.length);
    return [...new Uint8Array(await crypto.subtle.digest('SHA-1',buf))].map(b=>b.toString(16).padStart(2,'0')).join('')+f.size;
  }catch(e){return '';}}
async function findDupes(){
  const groups=[],seen=new Set();
  const add=list=>{if(list.length<2)return;const ids=list.map(t=>t.id).sort().join();if(seen.has(ids))return;seen.add(ids);groups.push(list);};
  const m1=new Map(),m2=new Map();
  for(const t of arr()){
    const k1=norm(t.artist)+'|'+norm(t.title);
    if(norm(t.title)){if(!m1.has(k1))m1.set(k1,[]);m1.get(k1).push(t);}
    if(t.size){const k2=t.size+'|'+Math.round(t.duration||0);if(!m2.has(k2))m2.set(k2,[]);m2.get(k2).push(t);}
  }
  m1.forEach(add);
  for(const list of m2.values()){
    if(list.length<2)continue;
    const byHash=new Map();
    for(const t of list){const h=await quickHash(t.id);if(!h)continue;if(!byHash.has(h))byHash.set(h,[]);byHash.get(h).push(t);}
    byHash.forEach(add);
  }
  return groups.map(g=>{
    const best=g.slice().sort((a,b)=>(b.size||0)-(a.size||0)||(b.cover?1:0)-(a.cover?1:0)||a.added-b.added)[0];
    return {tracks:g,keep:best.id};});}

const MAGIC='FONOTEKA1';
async function exportBackup(){
  const ts=arr();if(!ts.length){toast('Библиотека пуста, сохранять нечего');return;}
  toast('Собираю резервную копию…');
  const parts=[],items=[];
  for(const t of ts){
    const f=await sGet('files',t.id);if(!f)continue;
    const meta=Object.assign({},t);delete meta.cover;
    items.push({meta,fs:f.size,fn:f.name,ft:f.type||'',cs:t.cover?t.cover.size:0,ct:t.cover?(t.cover.type||'image/jpeg'):''});
    parts.push(f);if(t.cover)parts.push(t.cover);
  }
  const man=new TextEncoder().encode(JSON.stringify({v:1,created:Date.now(),tracks:items,playlists:S.playlists,plays:S.plays,wish:readWish()}));
  const head=new Uint8Array(13);
  for(let i=0;i<9;i++)head[i]=MAGIC.charCodeAt(i);
  new DataView(head.buffer).setUint32(9,man.length);
  const blob=new Blob([head,man,...parts],{type:'application/octet-stream'});
  const d=new Date(),name='fonoteka-'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'.fonoteka';
  try{
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},8000);
    lsSet('fono.lastBackup',Date.now());
    toast('Копия готова: '+name+' ('+fmtMB(blob.size)+')');
  }catch(e){toast('Не удалось сохранить файл. Откройте приложение в браузере, а не внутри другого приложения');}
}
async function importBackup(file){
  try{
    const head=new DataView(await file.slice(0,13).arrayBuffer());
    let magic='';for(let i=0;i<9;i++)magic+=String.fromCharCode(head.getUint8(i));
    if(magic!==MAGIC){toast('Это не файл резервной копии Фонотеки');return;}
    const len=head.getUint32(9);
    const man=JSON.parse(await file.slice(13,13+len).text());
    let off=13+len,added=0,skipped=0;
    for(let i=0;i<man.tracks.length;i++){
      const it=man.tracks[i];
      const fb=file.slice(off,off+it.fs,it.ft);off+=it.fs;
      let cb=null;if(it.cs){cb=file.slice(off,off+it.cs,it.ct);off+=it.cs;}
      toast('Восстанавливаю '+(i+1)+' из '+man.tracks.length+'…');
      if(S.tracks.has(it.meta.id)){skipped++;continue;}
      const t=Object.assign({},it.meta,{cover:cb});
      await sPut('files',fb,t.id);await sPut('tracks',t);S.tracks.set(t.id,t);added++;
    }
    for(const p of man.playlists||[]){
      const ex=S.playlists.find(x=>x.id===p.id);
      if(ex){ex.ids=[...new Set([...ex.ids,...p.ids])];save('playlists',ex);}
      else{S.playlists.push(p);save('playlists',p);}
    }
    const have=new Set(S.plays.map(p=>p.tid+'|'+p.ts));
    const newP=(man.plays||[]).filter(p=>!have.has(p.tid+'|'+p.ts));
    if(newP.length){S.plays=S.plays.concat(newP);await sReplacePlays(S.plays).catch(()=>{});}
    if(man.wish&&man.wish.length){const w=readWish(),ids=new Set(w.map(x=>x.id));writeWish(w.concat(man.wish.filter(x=>!ids.has(x.id))));}
    toast('Восстановлено треков: '+added+(skipped?' (уже были: '+skipped+')':''));
    render();
  }catch(e){toast('Не удалось прочитать файл копии');}
}

/* ---------- список «хочу найти» (импорт из Spotify) ---------- */
const readWish=()=>lsGet('fono.wish',[])||[];
const writeWish=a=>lsSet('fono.wish',a);
function parseCSV(t){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';}
    else f+=c;
  }
  if(f.length||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(x=>x.trim()));}
function parseWish(text,listName){
  text=String(text||'').replace(/^﻿/,'');
  const out=[];
  const first=(text.split(/\r?\n/)[0]||'').toLowerCase();
  if(first.includes('track name')||first.includes('track uri')){
    const rows=parseCSV(text),h=rows[0].map(x=>x.trim().toLowerCase());
    const ti=h.findIndex(x=>x.startsWith('track name')),ai=h.findIndex(x=>x.startsWith('artist name')),bi=h.findIndex(x=>x.startsWith('album name'));
    for(const r of rows.slice(1)){
      const title=(r[ti]||'').trim();if(!title)continue;
      out.push({id:uid(),title,artist:((r[ai]||'').split(/[;,]/)[0]||'').trim(),album:bi>=0?(r[bi]||'').trim():'',list:listName});
    }
  }else{
    for(const line of text.split(/\r?\n/)){
      const l=line.trim();if(!l)continue;
      const m=l.match(/^(.+?)\s+[-–—]\s+(.+)$/);
      out.push(m?{id:uid(),artist:m[1].trim(),title:m[2].trim(),album:'',list:listName}:{id:uid(),artist:'',title:l,album:'',list:listName});

async function jamendoQuery(key,extra){

async function jamendoSearch(q){

async function archiveSearch(q){

async function archiveFiles(id){

async function fetchBlob(url,onp){
  const r=await fetch(url);if(!r.ok)throw new Error('http '+r.status);
  const total=+r.headers.get('content-length')||0;
  if(!r.body||!r.body.getReader)return await r.blob();
  const rd=r.body.getReader(),chunks=[];let got=0;
  for(;;){const {done,value}=await rd.read();if(done)break;chunks.push(value);got+=value.length;if(onp)onp(got,total);}
  return new Blob(chunks,{type:r.headers.get('content-type')||''});}
async function downloadToLibrary(key,info,url,fname,onp){
  const blob=await fetchBlob(url,onp);
  if(blob.size<20000)throw new Error('small');

  if(info.img){try{const ib=await fetchBlob(info.img);cov=await shrinkImage(ib,320);}catch(e){}}
  const file=new File([blob],fname,{type});

  return {dup:false};}

const A=[new Audio(),new Audio()];
A.forEach(a=>{a.preload='auto';});
let audio=A[0];
const G={ctx:null,gain:[],eq:[],pre:null,an:null};
const EQ_FREQ=[60,230,910,3600,14000],EQ_TYPE=['lowshelf','peaking','peaking','peaking','highshelf'];
const EQ_PRESETS={flat:['Плоский',[0,0,0,0,0]],bass:['Бас',[7,4,0,-1,0]],vocal:['Голос',[-2,0,3,4,1]],treble:['Высокие',[-1,0,0,3,6]],rock:['Рок',[5,2,-2,3,5]],soft:['Мягко',[2,1,0,-2,-4]]};
function ensureGraph(){
  if(G.ctx)return true;
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;
    G.ctx=new C();
    const mix=G.ctx.createGain();
    A.forEach((a,i)=>{const s=G.ctx.createMediaElementSource(a);const g=G.ctx.createGain();s.connect(g);g.connect(mix);G.gain[i]=g;});
    let node=mix;
    G.eq=EQ_FREQ.map((f,i)=>{const b=G.ctx.createBiquadFilter();b.type=EQ_TYPE[i];b.frequency.value=f;b.Q.value=1;b.gain.value=0;node.connect(b);node=b;return b;});
    G.pre=G.ctx.createGain();node.connect(G.pre);
    G.an=G.ctx.createAnalyser();G.an.fftSize=128;G.an.smoothingTimeConstant=.8;
    G.pre.connect(G.an);G.an.connect(G.ctx.destination);
    applyEq();return true;
  }catch(e){G.ctx=null;return false;}}
function applyEq(){
  if(!G.ctx)return;
  const e=S.set.eq;
  G.eq.forEach((b,i)=>{b.gain.value=e.on?e.g[i]:0;});
  G.pre.gain.value=e.on?Math.pow(10,e.pre/20):1;}
function resumeCtx(){if(G.ctx&&G.ctx.state==='suspended')G.ctx.resume().catch(()=>{});}
function gainsFor(fade,old,el){
  if(!G.ctx)return;
  const i=A.indexOf(el),j=1-i,now=G.ctx.currentTime,d=Math.max(.5,S.set.xf);
  const gi=G.gain[i].gain,gj=G.gain[j].gain;
  gi.cancelScheduledValues(now);gj.cancelScheduledValues(now);
  if(fade){
    gi.setValueAtTime(0,now);gi.linearRampToValueAtTime(1,now+d);
    gj.setValueAtTime(gj.value,now);gj.linearRampToValueAtTime(0,now+d);
    setTimeout(()=>{if(old!==audio)old.pause();},d*1000+150);
  }else{gi.setValueAtTime(1,now);}}

async function loadCur(play,opts){

function bindAudio(a){

/* ---------- визуализатор ---------- */
let vizRaf=0,vizColor='#F0A81C';
function getAnalyser(){
  if(G.an)return G.an;
  const el=audio;
  if(el._an===undefined){
    el._an=null;
    try{
      const cs=el.captureStream?el.captureStream():(el.mozCaptureStream?el.mozCaptureStream():null);
      if(cs&&cs.getAudioTracks().length){
        const C=window.AudioContext||window.webkitAudioContext;const ctx=new C();
        const src=ctx.createMediaStreamSource(cs);const an=ctx.createAnalyser();an.fftSize=128;an.smoothingTimeConstant=.8;
        src.connect(an);el._an=an;el._vctx=ctx;
      }else el._an=undefined;
    }catch(e){el._an=null;}
  }
  if(el._vctx&&el._vctx.state==='suspended')el._vctx.resume().catch(()=>{});
  return el._an||null;}
function startViz(){
  stopViz();
  const cv=$('#viz');if(!cv||!S.viz)return;
  if(!getAnalyser()){
    if(!audio.paused||audio.src){/* повторим при следующем кадре, если звук ещё не пошёл */}
  }
  vizColor=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#F0A81C';
  const ctx=cv.getContext('2d');
  let tries=0,had=false;
  const loop=()=>{
    vizRaf=requestAnimationFrame(loop);
    const c=$('#viz');if(!c)return stopViz();
    const an=getAnalyser();
    const dpr=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;
    if(c.width!==Math.round(w*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);}
    const g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);
    if(!an){tries++;if(tries===90){toast('Визуализатор не поддерживается в этом браузере');S.viz=false;stopViz();renderFull();}return;}
    had=true;
    const n=an.frequencyBinCount,d=new Uint8Array(n);an.getByteFrequencyData(d);
    const bars=28,bw=c.width/bars,use=Math.floor(n*.75);
    g.fillStyle=vizColor;
    for(let i=0;i<bars;i++){
      const v=d[Math.floor(i/bars*use)]/255,bh=Math.max(c.height*.03,v*c.height*.9);
      const x=i*bw+bw*.18,ww=bw*.64,y=c.height-bh;
      g.beginPath();if(g.roundRect)g.roundRect(x,y,ww,bh,ww/2);else g.rect(x,y,ww,bh);g.fill();
    }};
  loop();}
function stopViz(){if(vizRaf){cancelAnimationFrame(vizRaf);vizRaf=0;}}

/* библиотека */
function filteredLib(){
  let ts=arr();const q=S.q.trim().toLowerCase();
  if(q)ts=ts.filter(t=>(t.title+' '+t.artist+' '+t.album).toLowerCase().includes(q));
  if(S.sort==='new')ts.sort((a,b)=>b.added-a.added);
  else if(S.sort==='az')ts.sort((a,b)=>a.title.localeCompare(b.title,'ru'));
  else ts.sort((a,b)=>(a.artist||'я').localeCompare(b.artist||'я','ru')||a.title.localeCompare(b.title,'ru'));
  return ts;}
function libList(){
  const ts=filteredLib();
  return ts.length?listHtml(ts,'Библиотека'):`<p class="muted" style="text-align:center;padding:24px 0">Ничего не нашлось. Попробуйте английское слово (chill, piano, rock) или другой источник: русской музыки здесь мало.</p>`;}
function plCover(ids){const t=ids.map(T).find(x=>x&&x.cover)||T(ids[0]);return t?cover(t):`<div class="cv" style="background:var(--surface2);color:var(--ink3)">${ic('note')}</div>`;}
function groupRows(type){
  const m=groupBy(type==='album'?albumKey:artistKey);
  const keys=[...m.keys()].sort((a,b)=>(a===''?1:0)-(b===''?1:0)||a.localeCompare(b,'ru'));
  return keys.map(k=>{
    const ts=m.get(k),name=k||(type==='album'?'Без альбома':'Неизвестный артист');

    if(type==='album'){const ar=[...new Set(ts.map(t=>t.artist).filter(Boolean))];sub=(ar.length===1?ar[0]:ar.length>1?'Разные исполнители':'')+(ar.length?' · ':'')+sub;}
    return `<div class="pl" data-act="open-group" data-gt="${type}" data-k="${esc(k)}" tabindex="0" role="button">${plCover(ts.map(t=>t.id))}<div class="rt"><b>${esc(name)}</b><span>${esc(sub)}</span></div></div>`;}).join('');}
function viewLib(){
  setTop('Библиотека',nTracks(S.tracks.size));

  if(S.libTab==='albums')return demoBanner()+seg+`<div class="list">${groupRows('album')}</div>`;

/* плейлисты */

  ${S.playlists.map(p=>{const ids=p.ids.filter(id=>T(id));return `<div class="pl" data-act="openpl" data-id="${p.id}" tabindex="0" role="button">${plCover(ids)}<div class="rt"><b>${esc(p.name)}</b><span>${nTracks(ids.length)}</span></div></div>`;}).join('')}

function detailInfo(v){
  if(v.type==='liked')return {name:'Любимое',ts:arr().filter(t=>t.liked).sort((a,b)=>a.title.localeCompare(b.title,'ru')),pl:null};
  if(v.type==='pl'){const p=S.playlists.find(x=>x.id===v.id);if(!p)return null;return {name:p.name,ts:p.ids.map(T).filter(Boolean),pl:p.id,own:true};}
  if(v.type==='album'||v.type==='artist'){const ts=groupTracks(v.type,v.key);if(!ts.length)return null;return {name:v.key||(v.type==='album'?'Без альбома':'Неизвестный артист'),ts,pl:null};}
  if(v.type==='smart'){const s=SMART.find(x=>x.k===v.k);if(!s)return null;return {name:s.name,ts:smartTracks(v.k),pl:null,desc:s.desc};}

/* статистика */
function readoutHtml(b){return `${esc(b.label)} <span>· ${b.sec?fmtMin(b.sec):'тишина'}</span>`;}
function viewStats(){
  setTop('Статистика','');
  const bs=buckets(S.range),from=bs[0].from,A_=agg(from);
  const totalSec=[...A_.values()].reduce((s,a)=>s+a.sec,0),plays=[...A_.values()].reduce((s,a)=>s+a.plays,0);
  const ranges=[['7','7 дней'],['30','30 дней'],['all','Год']];
  const chips=`<div class="chips" style="margin-bottom:14px">${ranges.map(r=>`<button class="chip${S.range===r[0]?' on':''}" data-act="srange" data-v="${r[0]}">${r[1]}</button>`).join('')}</div>`;
  const wr=`<button class="btn wrbtn" data-act="open-wrapped">${ic('trophy')}Итоги ${new Date().getFullYear()} года</button>`;
  if(!S.plays.some(p=>S.tracks.has(p.tid)))
    return goalCard()+`<div style="height:14px"></div>`+chips+`<div class="empty"><div class="note">${ic('chart')}</div><h3>Статистика появится после первых прослушиваний</h3><p>Трек засчитывается, когда вы послушали 30 секунд или половину песни. Пропуски в первые секунды учитываются отдельно и влияют на «Мою волну».</p></div>`;
  const max=Math.max(...bs.map(b=>b.sec),1);
  const sel=S.statsSel!=null&&bs[S.statsSel]?S.statsSel:bs.length-1;
  const bars=bs.map((b,i)=>`<div class="bc${i===sel?' on':''}" data-act="bar" data-i="${i}" role="button" aria-label="${esc(b.label)}: ${b.sec?fmtMin(b.sec):'тишина'}"><i style="height:${Math.round(b.sec/max*100)}%;animation-delay:${i*12}ms"></i></div>`).join('');
  const topT=[...A_.entries()].sort((a,b)=>b[1].plays-a[1].plays||b[1].sec-a[1].sec).filter(e=>e[1].plays>0).slice(0,5);
  const maxP=topT.length?topT[0][1].plays:1;
  const byArtist=new Map();
  for(const [id,a] of A_){const n=T(id).artist||'Неизвестный артист';const x=byArtist.get(n)||{sec:0,plays:0};x.sec+=a.sec;x.plays+=a.plays;byArtist.set(n,x);}
  const topA=[...byArtist.entries()].sort((a,b)=>b[1].sec-a[1].sec).slice(0,5);const maxS=topA.length?topA[0][1].sec:1;
  const parts=[['Ночь',0,6],['Утро',6,12],['День',12,18],['Вечер',18,24]].map(([n,a,b])=>{let s=0;for(const p of S.plays){if(p.ts<from||!S.tracks.has(p.tid))continue;const h=new Date(p.ts).getHours();if(h>=a&&h<b)s+=p.sec;}return [n,s];});
  const maxPart=Math.max(...parts.map(p=>p[1]),1);
  return `${goalCard()}${wr}${chips}
  <div class="card"><div class="hero">${fmtMin(totalSec)}</div><div class="muted" style="font-size:13px;font-weight:600">слушали за период</div>
    <div class="kpis"><div><b>${plays}</b><span>${plural(plays,'прослушивание','прослушивания','прослушиваний')}</span></div><div><b>${[...A_.values()].filter(a=>a.plays>0).length}</b><span>разных треков</span></div><div><b>${topA.length?esc(topA[0][0]):'—'}</b><span>чаще всего</span></div></div></div>
  <h2>Минуты по ${S.range==='all'?'месяцам':'дням'}</h2>
  <div class="card"><div class="readout" id="readout">${readoutHtml(bs[sel])}</div>
    <div class="chart" id="chart" aria-label="Минуты прослушивания, максимум ${fmtMin(max)}">${bars}</div>
    <div class="axis"><span>${esc(bs[0].short)}</span><span>макс ${fmtMin(max)}</span><span>${esc(bs[bs.length-1].short)}</span></div></div>
  ${topT.length?`<h2>Любимые треки</h2><div class="card rank">${topT.map(([id,a],i)=>{const t=T(id);return `<div class="rk"><span class="n">${i+1}</span>${cover(t,'m')}<div class="rt"><b>${esc(t.title)}</b><s style="width:${Math.max(6,a.plays/maxP*100)}%"></s></div><span class="v">${a.plays} ${plural(a.plays,'раз','раза','раз')}</span></div>`;}).join('')}</div>`:''}
  <h2>Исполнители</h2><div class="card rank">${topA.map(([n,a],i)=>`<div class="rk ar"><span class="n">${i+1}</span><div class="rt"><b>${esc(n)}</b><s style="width:${Math.max(6,a.sec/maxS*100)}%"></s></div><span class="v">${fmtMin(a.sec)}</span></div>`).join('')}</div>
  <h2>Когда вы слушаете</h2><div class="card">${parts.map(([n,s])=>`<div class="part"><span>${n}</span><s style="width:${Math.max(2,s/maxPart*100)}%"></s><span class="v">${s?fmtMin(s):'—'}</span></div>`).join('')}</div>
  <div style="margin-top:26px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center"><button class="btn sm" data-act="reset-stats"><span class="lbl">Сбросить статистику</span></button><span class="muted" style="font-size:12px;max-width:34ch">Удалит историю прослушиваний и то, чему научилась «Моя волна». Музыка, плейлисты и лайки останутся.</span></div>`;}

function animateCounts(){
  $$('[data-count]').forEach(el=>{
    const to=+el.dataset.count,dec=+el.dataset.dec||0,t0=performance.now(),dur=900;
    const step=n=>{const k=Math.min(1,(n-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=(to*e).toFixed(dec).replace('.',',');if(k<1)requestAnimationFrame(step);};
    requestAnimationFrame(step);});}

let armKey=null,armT=null;
function armed(key,el,txt){
  if(armKey===key){armKey=null;clearTimeout(armT);return true;}
  armKey=key;const l=el.querySelector('.lbl'),old=l?l.textContent:'';
  if(l)l.textContent=txt;else toast(txt);
  el.classList.add('armed');clearTimeout(armT);
  armT=setTimeout(()=>{armKey=null;if(el.isConnected){if(l)l.textContent=old;el.classList.remove('armed');}},4000);

/* ---------- удаление и сброс ---------- */
async function removeTrackData(id){
  if(curId()===id){flush(false);audio.pause();audio.removeAttribute('src');S.tok++;S.queue=S.queue.filter(x=>x!==id);S.base=S.base.filter(x=>x!==id);S.qi=-1;S.cur=null;}
  else{const c=curId();S.queue=S.queue.filter(x=>x!==id);S.base=S.base.filter(x=>x!==id);S.qi=c?S.queue.indexOf(c):-1;}
  S.tracks.delete(id);dropCoverUrl(id);
  await sDel('tracks',id).catch(()=>{});await sDel('files',id).catch(()=>{});
  for(const p of S.playlists){if(p.ids.includes(id)){p.ids=p.ids.filter(x=>x!==id);save('playlists',p);}}
  if(S.qi<0)S.queue=[];}
async function deleteTrack(id){await removeTrackData(id);closeSheet();toast('Трек удалён');render(true);renderFull();saveState(true);}
async function removeDemos(){
  const ids=arr().filter(isDemo).map(t=>t.id);if(!ids.length)return;
  for(const id of ids)await removeTrackData(id);
  const set=new Set(ids);S.plays=S.plays.filter(p=>!set.has(p.tid));
  await sReplacePlays(S.plays).catch(()=>{});
  toast('Демо-треки удалены');render();renderFull();saveState(true);}

  const p={id:uid(),name,ids:[],created:Date.now()};S.playlists.push(p);save('playlists',p);return p;}

  sheet(`<h3>Треки в «${esc(p.name)}»</h3>${arr().sort((a,b)=>a.title.localeCompare(b.title,'ru')).map(t=>`<button class="mi${p.ids.includes(t.id)?' on':''}" data-act="pick" data-id="${plid}" data-tid="${t.id}">${esc(t.title)}<span class="ck">${ic('check')}</span></button>`).join('')}`);}

  <div class="stick"><button class="btn pri" data-act="ed-save" style="width:100%">Сохранить</button></div>`);}
function saveEdit(){
  const e=S.edit,t=e&&T(e.id);if(!t)return;
  t.title=$('#ed-title').value.trim()||t.title;t.artist=$('#ed-artist').value.trim();t.album=$('#ed-album').value.trim();
  t.lyrics=$('#ed-lyrics').value.slice(0,30000);t.mood=e.mood;t.nowave=e.nowave;
  if(e.cover!==undefined){dropCoverUrl(t.id);t.cover=e.cover;}
  save('tracks',t);closeSheet();toast('Сохранено');render(true);renderMini();renderFull();if(curId()===t.id)setMedia(t);}
function openLyrics(id){const t=T(id);if(!t||!t.lyrics)return;sheet(`<h3>${esc(t.title)}</h3><div class="lyr">${esc(t.lyrics)}</div>`);}
