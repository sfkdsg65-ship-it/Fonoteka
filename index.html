function openWishPaste(){
  sheet(`<h3>Вставить список</h3><input class="field" id="wp-name" placeholder="Название списка (необязательно)" maxlength="60"><textarea class="field ta" id="wp-text" rows="8" placeholder="По одной песне в строке:&#10;Исполнитель - Название" style="margin-top:8px"></textarea><button class="btn pri" data-act="wish-parse" style="margin-top:8px">Добавить в список</button>`);}
function addWish(items){
  const w=readWish(),keys=new Set(w.map(x=>norm(x.artist)+'|'+norm(x.title)+'|'+(x.list||'')));
  const fresh=items.filter(x=>!keys.has(norm(x.artist)+'|'+norm(x.title)+'|'+(x.list||'')));
  writeWish(w.concat(fresh));return fresh.length;}

/* ---------- онлайн ---------- */
const refreshO=()=>{const r=$('#o-res');if(r)r.innerHTML=oRows();};
function netErr(e){
  if(e&&e.message==='nokey')return 'Нужен ключ Jamendo';
  if(e&&/http (401|403)/.test(e.message||''))return 'Сервис не принял запрос. Для Jamendo проверьте ключ.';
  if(e instanceof TypeError)return 'Не удалось связаться с сервисом. Проверьте интернет. Если вы открыли приложение внутри другой программы, откройте его в браузере.';
  return 'Не получилось: '+(e&&e.message||'ошибка');}
async function oSearch(){
  const o=S.online,inp=$('#oq');if(inp)o.q=inp.value.trim();
  if(!o.q)return;
  if(navigator.onLine===false){o.err='Нет интернета. Поиск заработает, когда сеть появится.';o.res=null;refreshO();return;}
  if(o.src==='jamendo'&&!S.set.jamendo){toast('Сначала введите ключ Jamendo');return;}
  o.busy=true;o.err='';refreshO();
  try{o.res=o.src==='jamendo'?await jamendoSearch(o.q):await archiveSearch(o.q);}
  catch(e){console.warn('online',e);o.res=null;o.err=netErr(e);}
  o.busy=false;refreshO();}
const safeName=r=>((r.artist?r.artist+' - ':'')+r.title).replace(/[\\/:*?"<>|]+/g,' ').slice(0,100);
async function doDl(r,key,f){
  const o=S.online;o.dl[key]={state:'busy',p:null};refreshO();
  try{
    const info={src:r.src,title:f.title||r.title,artist:r.artist,album:r.album||'',img:r.img,license:r.license||''};
    const res=await downloadToLibrary(key,info,f.url,f.name,(g,tot)=>{o.dl[key].p=tot?g/tot:null;const b=$(`.orow[data-oi="${o.res.findIndex(x=>x.src+x.id===key)}"] .lbl`);if(b)b.textContent=tot?Math.round(g/tot*100)+'%':'…';});
    o.dl[key]={state:'done'};toast(res.dup?'Этот трек уже в библиотеке':'Добавлено в библиотеку: '+info.title);
  }catch(e){
    o.dl[key]={state:'err'};
    toast(e.message==='small'?'Файл слишком маленький, возможно, это не музыка':'Сервис не отдал файл приложению. Откройте страницу трека и скачайте вручную');}
  refreshO();}
async function oDownload(i){
  const o=S.online,r=o.res[i],key=r.src+r.id;
  if(r.src==='archive'){
    try{
      toast('Смотрю файлы…');const fl=await archiveFiles(r.id);
      if(!fl.length){toast('В этой записи нет аудиофайлов');return;}
      if(fl.length===1)doDl(r,key,{url:fl[0].url,name:fl[0].name.split('/').pop(),title:r.title});
      else{o.files={i,list:fl};sheet(`<h3>${esc(r.title)}</h3><p class="muted" style="margin:0 0 6px;font-size:13px">Выберите файл:</p>${fl.map((f,j)=>`<button class="mi" data-act="o-dl-file" data-j="${j}">${ic('download')}<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.title)}</span>${f.size?`<span class="ck" style="opacity:1;color:var(--ink3);font-size:12px">${fmtMB(f.size)}</span>`:''}</button>`).join('')}<a class="mi" href="${esc(r.page)}" target="_blank" rel="noopener">${ic('link')}Открыть страницу записи</a>`);}
    }catch(e){toast(netErr(e));}
    return;}
  doDl(r,key,{url:r.url,name:safeName(r)+'.mp3',title:r.title});}
function openOnline(q){
  if(q!=null)S.online.q=q;
  if(!S.view||S.view.type!=='online')setView({type:'online'});
  render();window.scrollTo(0,0);
  if(q)oSearch();}

/* ---------- клики ---------- */
document.addEventListener('click',e=>{
  if(S.lp){S.lp=false;return;}
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,v=el.dataset.v;
  switch(act){
    case 'tab':S.tab=v;setView(null);saveState(true);render();window.scrollTo(0,0);break;
    case 'play':{
      if(S.sel){toggleSel(el.dataset.tid);break;}
      const ctx=el.closest('[data-ctx]');const ids=$$('[data-tid]',ctx).map(r=>r.dataset.tid);
      startQueue(ids,Math.max(0,ids.indexOf(el.dataset.tid)),ctx.dataset.label||'Библиотека',false);break;}
    case 'menu':{const ctx=el.closest('[data-ctx]');openTrackMenu(el.closest('[data-tid]').dataset.tid,ctx&&ctx.dataset.pl);break;}
    case 'wave':if(S.wave&&S.queue.length)togglePlay();else startWave();break;
    case 'wmode':
      S.waveMode=v;
      if(S.wave&&S.qi>=0){const keep=S.queue.slice(0,S.qi+1);S.queue=keep.concat(buildWave(12,new Set(keep.slice(-6)),curId()));S.base=S.queue.slice();toast('Волна перестроена');}
      saveState(true);render(true);break;
    case 'wave-set':openWaveSet();break;
    case 'ws-mood':S.set.ws.mood=v;saveSet();openWaveSet();break;
    case 'ws-gap':S.set.ws.gap=!S.set.ws.gap;saveSet();openWaveSet();break;
    case 'random':{
      const ids=arr().map(t=>t.id);if(!ids.length)break;
      const pick=ids[Math.floor(Math.random()*ids.length)];
      startQueue([pick,...shuffle(ids.filter(x=>x!==pick))],0,'Случайная песня',false);break;}
    case 'shuffleall':startQueue(shuffle(arr().map(t=>t.id)),0,'Вся музыка вперемешку',false);break;
    case 'addfiles':break;
    case 'demo':addDemos();break;
    case 'exit-demo':removeDemos();break;
    case 'sort':S.sort=v;saveState(true);render(true);break;
    case 'libtab':S.libTab=v;exitSel();saveState(true);render();break;
    case 'open-group':setView({type:el.dataset.gt,key:el.dataset.k});render();window.scrollTo(0,0);break;
    case 'open-smart':setView({type:'smart',k:el.dataset.k});render();window.scrollTo(0,0);break;
    case 'newpl':openNewPl();break;
    case 'openpl':setView({type:'pl',id:el.dataset.id});render();window.scrollTo(0,0);break;
    case 'openliked':setView({type:'liked'});render();window.scrollTo(0,0);break;
    case 'back':setView(null);render();break;
    case 'plplay':case 'plshuffle':{
      const ctx=$('#main [data-ctx]');if(!ctx)break;
      let ids=$$('[data-tid]',ctx).map(r=>r.dataset.tid);
      if(act==='plshuffle')ids=shuffle(ids);
      startQueue(ids,0,ctx.dataset.label,false);break;}
    case 'pladd':openPick(S.view.id);break;
    case 'plmenu':openPlMenu();break;
    case 'pl-create':{const p=createPl($('#npl-name').value);if(p){closeSheet();render();toast('Плейлист создан');}break;}
    case 'pl-create-add':{
      const p=createPl($('#npl-name').value);if(!p)break;
      const ids=S.plTargets||[];p.ids.push(...ids);save('playlists',p);
      closeSheet();toast('Добавлено в «'+p.name+'»');if(S.sel)exitSel();render(true);break;}
    case 'pl-toggle':{
      const p=S.playlists.find(x=>x.id===el.dataset.id),id=S.menu&&S.menu.id;if(!p||!id)break;
      const has=p.ids.includes(id);p.ids=has?p.ids.filter(x=>x!==id):p.ids.concat(id);save('playlists',p);
      el.classList.toggle('on',!has);toast(has?'Убрано из «'+p.name+'»':'Добавлено в «'+p.name+'»');break;}
    case 'selpl-add':{
      const p=S.playlists.find(x=>x.id===el.dataset.id);if(!p)break;
      const ids=S.plTargets||[];let n=0;for(const id of ids)if(!p.ids.includes(id)){p.ids.push(id);n++;}
      save('playlists',p);closeSheet();exitSel();toast('Добавлено в «'+p.name+'»: '+n);render(true);break;}
    case 'pick':{
      const p=S.playlists.find(x=>x.id===el.dataset.id);if(!p)break;const id=el.dataset.tid,has=p.ids.includes(id);
      p.ids=has?p.ids.filter(x=>x!==id):p.ids.concat(id);save('playlists',p);el.classList.toggle('on',!has);render(true);break;}
    case 'pl-rename':{const p=S.playlists.find(x=>x.id===S.view.id),n=$('#pl-name').value.trim();if(p&&n){p.name=n;save('playlists',p);closeSheet();render(true);}break;}
    case 'pl-del':
      if(!armed('pl',el,'Нажмите ещё раз, чтобы удалить'))break;
      {const id=S.view.id;S.playlists=S.playlists.filter(p=>p.id!==id);sDel('playlists',id).catch(()=>{});closeSheet();setView(null);render();toast('Плейлист удалён');}break;
    case 'm-next':{const id=S.menu.id;if(!S.queue.length){startQueue([id],0,'');}else{S.queue.splice(S.qi+1,0,id);S.base.push(id);toast('Сыграет следующим');}closeSheet();renderFull();break;}
    case 'm-last':{const id=S.menu.id;if(!S.queue.length){startQueue([id],0,'');}else{S.queue.push(id);S.base.push(id);toast('Добавлено в очередь');}closeSheet();renderFull();break;}
    case 'm-like':toggleLike(S.menu.id);break;
    case 'm-addpl':openAddToPl(S.menu.id);break;
    case 'm-edit':openEdit(S.menu.id);break;
    case 'm-lyrics':openLyrics(S.menu.id);break;
    case 'm-rmpl':{const p=S.playlists.find(x=>x.id===(S.menu.pl)),id=S.menu.id;if(p){p.ids=p.ids.filter(x=>x!==id);save('playlists',p);}closeSheet();render(true);break;}
    case 'm-del':if(!armed('t',el,'Нажмите ещё раз, чтобы удалить'))break;deleteTrack(S.menu.id);break;
    case 'sheet-close':closeSheet();break;
    case 'open-full':{const f=$('#full');if(f.hidden){f.hidden=false;pushLayer('full');}renderFull();break;}
    case 'fp-close':{$('#full').hidden=true;stopViz();popLayer('full');break;}
    case 'toggle':togglePlay();break;
    case 'next':next(false);break;
    case 'prev':prev();break;
    case 'shuf':toggleShuffle();break;
    case 'rep':cycleRepeat();break;
    case 'like-cur':toggleLike(curId());break;
    case 'addpl-cur':openAddToPl(curId());break;
    case 'jump':flush(false);S.qi=+el.dataset.i;loadCur(true);break;
    case 'viz-toggle':S.viz=!S.viz;if(!S.viz)stopViz();renderFull();break;
    case 'sleep':openSleep();break;
    case 'sleep-set':closeSheet();setSleep(el.dataset.k,+v);break;
    case 'lyrics':openLyrics(curId());break;
    case 'edit-cur':openEdit(curId());break;
    case 'ed-mood':if(S.edit){S.edit.mood=S.edit.mood===v?'':v;$$('#ed-moods .chip').forEach(c=>c.classList.toggle('on',c.dataset.v===S.edit.mood));}break;
    case 'ed-nowave':if(S.edit){S.edit.nowave=!S.edit.nowave;el.classList.toggle('on',S.edit.nowave);}break;
    case 'ed-cover-del':if(S.edit){S.edit.cover=null;const t=T(S.edit.id);$('#ed-cv').innerHTML=cover(Object.assign({},t,{cover:null}),'m');}break;
    case 'ed-save':saveEdit();break;
    case 'srange':S.range=v;S.statsSel=null;saveState(true);render(true);break;
    case 'bar':selBar(+el.dataset.i);break;
    case 'reset-stats':if(!armed('st',el,'Нажмите ещё раз: история удалится'))break;resetStats();break;
    case 'goal-set':openGoal();break;
    case 'goal':S.set.goal=+v;saveSet();closeSheet();render(true);break;
    case 'theme':S.set.theme=v;saveSet();applyTheme();render(true);break;
    case 'accent':S.set.accent=v;saveSet();applyTheme();render(true);break;
    case 'eq-toggle':{
      if(!S.set.eq.on){if(!ensureGraph()){toast('Этот браузер не поддерживает эквалайзер');break;}resumeCtx();}
      S.set.eq.on=!S.set.eq.on;applyEq();saveSet();el.textContent=S.set.eq.on?'Включён':'Выключен';el.classList.toggle('on',S.set.eq.on);break;}
    case 'eq-preset':{
      if(!ensureGraph()){toast('Этот браузер не поддерживает эквалайзер');break;}resumeCtx();
      S.set.eq.g=EQ_PRESETS[v][1].slice();S.set.eq.on=true;applyEq();saveSet();render(true);break;}
    case 'backup-export':exportBackup();break;
    case 'open-online':openOnline();break;
    case 'o-src':S.online.src=v;S.online.res=null;S.online.err='';render(true);break;
    case 'o-go':oSearch();break;
    case 'o-dl':oDownload(+el.dataset.i);break;
    case 'o-dl-file':{const o=S.online,f=o.files.list[+el.dataset.j],r=o.res[o.files.i];closeSheet();doDl(r,r.src+r.id,{url:f.url,name:f.name.split('/').pop(),title:f.title||r.title});break;}
    case 'jkey-save':{const k=($('#jkey').value||'').trim();if(!k){toast('Введите ключ');break;}S.set.jamendo=k;saveSet();render(true);toast('Ключ сохранён');break;}
    case 'open-wish':setView({type:'wish'});render();window.scrollTo(0,0);break;
    case 'wish-paste':openWishPaste();break;
    case 'wish-parse':{
      const items=parseWish($('#wp-text').value,($('#wp-name').value||'').trim()||'Мой список');
      if(!items.length){toast('Список пуст');break;}
      const n=addWish(items);closeSheet();toast('Добавлено песен: '+n);render(true);break;}
    case 'wish-find':{const w=readWish().find(x=>x.id===el.dataset.id);if(w)openOnline((w.artist+' '+w.title).trim());break;}
    case 'wish-pl':{
      const wish=readWish(),idx=wishIndex(),ids=[...new Set(wish.map(w=>{const m=matchWish(w,idx);return m&&m.id;}).filter(Boolean))];
      if(!ids.length)break;
      const name=(wish[0].list||'Из Spotify');const p=createPl(name);if(p){p.ids=ids;save('playlists',p);toast('Создан плейлист «'+name+'»: '+nTracks(ids.length));}break;}
    case 'wish-clear':if(!armed('wc',el,'Нажмите ещё раз'))break;writeWish([]);render(true);break;
    case 'open-dupes':setView({type:'dupes'});render();window.scrollTo(0,0);break;
    case 'dup-toggle':{const cb=el.querySelector('.cb');cb.classList.toggle('on');updDupeBtn();break;}
    case 'dup-del':{
      const marked=new Set($$('.dr').filter(d=>d.querySelector('.cb.on')).map(d=>d.dataset.id));
      (S.dupes||[]).forEach(g=>{if(g.tracks.every(t=>marked.has(t.id)))marked.delete(g.keep);});
      if(!marked.size){toast('Ничего не отмечено');break;}
      if(!armed('dd',el,'Нажмите ещё раз: удалить '+marked.size))break;
      (async()=>{for(const id of marked)await removeTrackData(id);toast('Удалено дублей: '+marked.size);render();renderFull();saveState(true);})();break;}
    case 'open-wrapped':setView({type:'wrapped'});render();window.scrollTo(0,0);break;
    case 'selmode':enterSel();break;
    case 'sel-cancel':exitSel();break;
    case 'sel-all':if(S.sel){$$('#main .row[data-tid]').forEach(r=>S.sel.add(r.dataset.tid));markSel();const n=$('#sel-n');if(n)n.textContent='Выбрано: '+S.sel.size;}break;
    case 'sel-play':{
      if(!S.sel||!S.sel.size)break;
      const ids=$$('#main .row[data-tid]').map(r=>r.dataset.tid).filter(id=>S.sel.has(id));
      exitSel();startQueue(ids,0,'Выбранное',false);break;}
    case 'sel-pl':{
      if(!S.sel||!S.sel.size){toast('Сначала выберите песни');break;}
      S.plTargets=[...S.sel];plListSheet('В плейлист ('+S.plTargets.length+')','selpl-add',S.plTargets);break;}
    case 'sel-del':{
      if(!S.sel||!S.sel.size){toast('Сначала выберите песни');break;}
      if(!armed('sd',el,'Нажмите ещё раз: удалить '+S.sel.size))break;
      const ids=[...S.sel];exitSel();
      (async()=>{for(const id of ids)await removeTrackData(id);toast('Удалено треков: '+ids.length);render(true);renderFull();saveState(true);})();break;}
  }
});
function selBar(i){
  S.statsSel=i;const bs=buckets(S.range);
  $$('.bc').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));
  const r=$('#readout');if(r&&bs[i])r.innerHTML=readoutHtml(bs[i]);}
document.addEventListener('mouseover',e=>{const b=e.target.closest&&e.target.closest('.bc');if(b)selBar(+b.dataset.i);});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button]')){e.preventDefault();e.target.click();}
  if(e.key==='Escape'){if(!$('#sheet').hidden)closeSheet();else if(!$('#full').hidden){$('#full').hidden=true;stopViz();popLayer('full');}else if(S.sel)exitSel();}
  if(e.key==='Enter'&&e.target.id==='npl-name'){const b=$('[data-act="pl-create"]')||$('[data-act="pl-create-add"]');if(b)b.click();}
  if(e.key==='Enter'&&e.target.id==='oq'){e.preventDefault();oSearch();}});
let setT=null;
document.addEventListener('input',e=>{
  const id=e.target.id||'';
  if(id==='q'){S.q=e.target.value;$('#lib-list').innerHTML=libList();}
  else if(id==='seek'){const d=audio.duration||(T(curId())&&T(curId()).duration)||0;const p=e.target.value/1000;e.target.style.setProperty('--p',(p*100)+'%');if(d)audio.currentTime=p*d;$('#t-cur').textContent=fmt(p*d);}
  else if(/^eq\d$/.test(id)){const i=+id.slice(2),val=+e.target.value;if(!ensureGraph()){toast('Этот браузер не поддерживает эквалайзер');return;}S.set.eq.g[i]=val;S.set.eq.on=true;applyEq();$('#eqv'+i).textContent=(val>0?'+':'')+val;const t=$('#eq-t');if(t){t.textContent='Включён';t.classList.add('on');}clearTimeout(setT);setT=setTimeout(saveSet,300);}
  else if(id==='eqpre'){const val=+e.target.value;if(!ensureGraph())return;S.set.eq.pre=val;S.set.eq.on=true;applyEq();$('#eqprev').textContent=(val>0?'+':'')+val+' дБ';clearTimeout(setT);setT=setTimeout(saveSet,300);}
  else if(id==='xfade'){const val=+e.target.value;if(val>0&&!ensureGraph()){toast('Этот браузер не поддерживает плавный переход');e.target.value=0;return;}S.set.xf=val;resumeCtx();$('#xfv').textContent=val?val+' с':'Выкл';clearTimeout(setT);setT=setTimeout(saveSet,300);}
  else if(id==='ws-disc'){S.set.ws.disc=+e.target.value;$('#ws-discv').textContent=e.target.value+'%';clearTimeout(setT);setT=setTimeout(saveSet,300);}
  else if(id==='jkey2'){S.set.jamendo=e.target.value.trim();clearTimeout(setT);setT=setTimeout(saveSet,300);}
});
$('#file-in').addEventListener('change',e=>{const f=e.target.files;if(f&&f.length)addFiles(f);e.target.value='';});
$('#backup-in').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)importBackup(f);e.target.value='';});
$('#wish-in').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  try{
    const items=parseWish(await f.text(),f.name.replace(/\.[^.]+$/,''));
    if(!items.length){toast('В файле не нашлось песен');return;}
    const n=addWish(items);toast('Добавлено песен: '+n);render(true);
  }catch(x){toast('Не удалось прочитать файл');}});
$('#cover-in').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];e.target.value='';if(!f||!S.edit)return;
  const b=await shrinkImage(f,320);if(!b||!S.edit){toast('Не удалось открыть картинку');return;}
  S.edit.cover=b;const u=URL.createObjectURL(b);$('#ed-cv').innerHTML=`<div class="cv m" style="background-image:url(${u})"></div>`;});
['dragenter','dragover'].forEach(ev=>window.addEventListener(ev,e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){e.preventDefault();document.body.classList.add('dropping');}}));
['dragleave','drop'].forEach(ev=>window.addEventListener(ev,e=>{if(ev==='dragleave'&&e.relatedTarget)return;document.body.classList.remove('dropping');if(ev==='drop'&&e.dataTransfer&&e.dataTransfer.files.length){e.preventDefault();addFiles(e.dataTransfer.files);}}));
window.addEventListener('online',()=>{if(S.view&&S.view.type==='online')render(true);});

/* ---------- запуск ---------- */
(async function init(){
  applyTheme();
  try{
    const [ts,pls,pl]=await Promise.all([sAll('tracks'),sAll('playlists'),sAll('plays')]);
    ts.forEach(t=>S.tracks.set(t.id,t));S.playlists=pls.sort((a,b)=>a.created-b.created);S.plays=pl;
  }catch(e){
    useMem=true;
    toast('Хранилище браузера недоступно: музыка сохранится только до закрытия страницы');
  }
  if(S.set.eq.on||S.set.xf>0)ensureGraph();
  try{await restoreState();}catch(e){}
  render();
  window.__fono={S,T,arr,A:()=>A,G,audio:()=>audio};
})();


})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}</script>
</body>
